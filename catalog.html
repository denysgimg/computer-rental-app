<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Прокат комп'ютерів</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e7c7b'/%3E%3Crect x='6' y='8' width='20' height='13' rx='2' fill='none' stroke='white' stroke-width='2.2'/%3E%3Cpath d='M12 26h8' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #12303a;
      --ink-soft: #46606a;
      --paper: #eaf0ef;
      --panel: #ffffff;
      --line: #cbd8d6;
      --teal: #0e7c7b;
      --teal-dark: #0a5c5b;
      --danger: #a3203a;
      --head: "Bahnschrift", "Segoe UI Semibold", "Arial Narrow", system-ui, sans-serif;
      --body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--paper);
    }

    /* ---------- Шапка й вкладки ---------- */

    .site-header {
      background: var(--ink);
      color: #fff;
      padding: 22px 24px 0;
    }

    .site-header .inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      color: #7fd6d2;
      flex: none;
    }

    .brand h1 {
      margin: 0;
      font-family: var(--head);
      font-size: 28px;
      font-weight: 600;
      line-height: 1.15;
    }

    .tagline {
      margin: 2px 0 0;
      color: #a9c4c4;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-top: 22px;
    }

    .tabs a {
      padding: 10px 22px;
      color: #b9cfcf;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px 8px 0 0;
    }

    .tabs a:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .tabs a.active {
      background: var(--paper);
      color: var(--ink);
    }

    /* ---------- Сторінка ---------- */

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 24px 8px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-family: var(--head);
      font-size: 20px;
      font-weight: 600;
    }

    /* ---------- Смуга статусів (вона ж фільтр) ---------- */

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .stat {
      appearance: none;
      border: 0;
      border-left: 1px solid var(--line);
      border-top: 4px solid var(--c, var(--ink));
      background: transparent;
      font: inherit;
      color: inherit;
      text-align: left;
      padding: 12px 18px 14px;
      cursor: pointer;
    }

    .stat:first-child {
      border-left: 0;
    }

    .stat:hover {
      background: #f3f8f7;
    }

    .stat[aria-pressed="true"] {
      background: #e6f2f1;
      box-shadow: inset 0 -3px 0 var(--c, var(--ink));
    }

    .stat-num {
      display: block;
      font-family: var(--head);
      font-size: 36px;
      font-weight: 600;
      line-height: 1.1;
      color: var(--c, var(--ink));
    }

    .stat-label {
      display: block;
      color: var(--ink-soft);
      font-size: 14px;
    }

    /* ---------- Повідомлення ---------- */

    .msg {
      margin: 0 0 16px;
      padding: 10px 14px;
      border-left: 4px solid;
      border-radius: 6px;
      font-weight: 600;
    }

    .msg:empty {
      display: none;
    }

    .msg-error {
      background: #fbe0e4;
      color: #7d1428;
      border-color: var(--danger);
    }

    .msg-ok {
      background: #dff3e8;
      color: #0e5632;
      border-color: #14683f;
    }

    /* ---------- Форми ---------- */

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .field label {
      font-weight: 600;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: #fff;
      padding: 9px 10px;
      border: 1px solid #9db2b0;
      border-radius: 5px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid #7fc8c5;
      outline-offset: 1px;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      padding: 9px 16px;
      border: 1px solid var(--teal);
      border-radius: 5px;
      background: var(--teal);
      color: #fff;
      font-weight: 600;
    }

    .btn:hover {
      background: var(--teal-dark);
      border-color: var(--teal-dark);
    }

    .btn-quiet {
      background: #fff;
      color: var(--ink);
      border-color: #9db2b0;
    }

    .btn-quiet:hover {
      background: #f3f8f7;
      border-color: var(--ink-soft);
    }

    .hint {
      margin: 2px 0 0;
      min-height: 1.5em;
      font-size: 14px;
      font-weight: 600;
    }

    .hint-idle {
      color: var(--ink-soft);
      font-weight: 400;
    }

    .hint-ok {
      color: #14683f;
    }

    .hint-error {
      color: var(--danger);
    }

    /* ---------- Пошук і таблиці ---------- */

    .toolbar-single {
      grid-template-columns: minmax(0, 1fr);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 150px 170px 190px;
      gap: 8px;
      margin-bottom: 12px;
    }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      padding: 10px 12px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-soft);
      background: #f4f8f7;
      border-bottom: 2px solid var(--line);
      white-space: nowrap;
    }

    td {
      padding: 11px 12px;
      vertical-align: middle;
      border-bottom: 1px solid #e3ebe9;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: #f6faf9;
    }

    td.empty {
      padding: 28px 14px;
      text-align: center;
      color: var(--ink-soft);
    }

    td.name {
      min-width: 150px;
      font-weight: 600;
    }

    td.nowrap {
      white-space: nowrap;
    }

    .actions {
      white-space: nowrap;
      text-align: right;
    }

    .row-btn {
      margin-left: 6px;
      padding: 4px 11px;
      font-size: 13px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #9db2b0;
      border-radius: 4px;
    }

    .row-btn:hover {
      background: #f3f8f7;
    }

    .row-btn.main {
      color: #fff;
      background: var(--teal);
      border-color: var(--teal);
    }

    .row-btn.main:hover {
      background: var(--teal-dark);
    }

    .row-btn.danger {
      color: var(--danger);
      border-color: #d9a3ae;
    }

    .row-btn.danger:hover {
      background: #fbe0e4;
    }

    /* ---------- Статуси ---------- */

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      background: var(--bg);
      color: var(--fg);
    }

    .pill::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fg);
    }

    .pill-available {
      --bg: #dff3e8;
      --fg: #14683f;
    }

    .pill-booked {
      --bg: #fcefcf;
      --fg: #8a5600;
    }

    .pill-rented {
      --bg: #fbe0e4;
      --fg: #a3203a;
    }

    .pill-returned {
      --bg: #e3e9eb;
      --fg: #47585f;
    }

    .tag-overdue {
      margin-left: 6px;
      padding: 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 4px;
      white-space: nowrap;
    }

    /* ---------- Сторінка клієнта ---------- */

    .who,
    .dates {
      margin-bottom: 18px;
    }

    .who-fields {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px;
    }

    .who-fields .field {
      margin-bottom: 0;
      flex: 1 1 220px;
      max-width: 320px;
    }

    .who-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .who-info[hidden],
    #login-form[hidden],
    .field[hidden] {
      display: none;
    }

    .dates-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .dates-grid .field {
      margin-bottom: 8px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .check input {
      width: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 5px solid var(--c, var(--line));
      border-radius: 8px;
    }

    .card h3 {
      margin: 0;
      font-family: var(--head);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.25;
    }

    .card .specs {
      margin: 0;
      color: var(--ink-soft);
    }

    .card .busy {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .card .busy strong {
      color: var(--ink);
    }

    .card .card-foot {
      margin-top: auto;
      padding-top: 8px;
    }

    .card .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .my {
      margin-top: 28px;
    }

    .my h2 {
      margin: 0 0 12px;
      font-family: var(--head);
      font-size: 20px;
      font-weight: 600;
    }

    /* ---------- Підвал ---------- */

    .site-footer {
      max-width: 1200px;
      margin: 28px auto 0;
      padding: 18px 24px 32px;
      color: var(--ink-soft);
      font-size: 13px;
      border-top: 1px solid var(--line);
    }

    .site-footer span {
      display: block;
    }

    /* ---------- Адаптивність ---------- */

    @media (max-width: 920px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar input {
        grid-column: 1 / -1;
      }

      .toolbar-single {
        grid-template-columns: minmax(0, 1fr);
      }

      .dates-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 560px) {
      .site-header,
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .stat-num {
        font-size: 28px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .dates-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="3" y="5" width="26" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <path d="M11 27h10M16 22v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>Прокат комп'ютерів</h1>
          <p class="tagline">Оберіть комп'ютер і забронюйте його самі</p>
        </div>
      </div>
      <nav class="tabs" aria-label="Розділи">
        <a href="index.html">Комп'ютери</a>
        <a href="clients.html">Клієнти</a>
        <a href="bookings.html">Бронювання</a>
        <a href="catalog.html" class="active" aria-current="page">Для клієнтів</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <p id="catalog-message" class="msg" role="status"></p>

    <section class="panel who" aria-label="Вхід клієнта">
      <form id="login-form" novalidate>
        <div class="who-fields">
          <div class="field">
            <label for="login-phone">Ваш телефон</label>
            <input type="tel" id="login-phone" placeholder="+380501234567">
          </div>
          <div class="field" id="register-field" hidden>
            <label for="login-name">Ваше ім'я (новий клієнт)</label>
            <input type="text" id="login-name" placeholder="Петро Іваненко">
          </div>
          <button type="submit" id="login-button" class="btn">Увійти</button>
        </div>
      </form>
      <div id="who-info" class="who-info" hidden>
        <span>Ви увійшли як <strong id="who-name"></strong></span>
        <button type="button" id="logout-button" class="btn btn-quiet">Вийти</button>
      </div>
    </section>

    <section class="panel dates" aria-label="Період і фільтри">
      <div class="dates-grid">
        <div class="field">
          <label for="cat-start">Початок</label>
          <input type="date" id="cat-start">
        </div>
        <div class="field">
          <label for="cat-end">Завершення</label>
          <input type="date" id="cat-end">
        </div>
        <div class="field">
          <label for="cat-type">Тип</label>
          <select id="cat-type">
            <option value="">Усі типи</option>
            <option value="ноутбук">ноутбук</option>
            <option value="ПК">ПК</option>
          </select>
        </div>
        <div class="field">
          <label for="cat-search">Пошук</label>
          <input type="search" id="cat-search" placeholder="Назва або процесор">
        </div>
      </div>
      <label class="check"><input type="checkbox" id="cat-free"> Лише вільні на ці дати</label>
      <p id="catalog-summary" class="hint hint-idle" aria-live="polite"></p>
    </section>

    <section aria-label="Каталог комп'ютерів">
      <div id="catalog" class="cards"></div>
    </section>

    <section id="my-section" class="my" aria-label="Мої бронювання" hidden>
      <h2>Мої бронювання</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Комп'ютер</th>
              <th>Період</th>
              <th>Статус</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="my-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Курсовий проєкт з дисципліни «Конструювання програмного забезпечення»</span>
    <span>Попадюк Денис, група ІС-23-01, 2026</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
