<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вебзастосунок обліку прокату комп'ютерів</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f3a5f;
      color: #fff;
      padding: 16px 24px;
    }

    header h1 {
      margin: 0 0 4px;
    }

    main {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
    }

    section + section {
      margin-top: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 8px 12px;
      border: 1px solid #ccd3da;
      text-align: left;
    }

    th {
      background: #e8edf2;
    }

    #message, #booking-message {
      min-height: 1.2em;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
    }

    form h3 {
      width: 100%;
      margin: 0;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input, select, button {
      padding: 8px;
      font-size: 14px;
    }

    td button {
      margin-right: 6px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
    }

    footer {
      text-align: center;
      color: #6b7785;
      font-size: 13px;
      padding: 24px 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Прокат комп'ютерів</h1>
    <p>Вебзастосунок обліку комп'ютерів і бронювань</p>
  </header>

  <main>
    <section id="computers">
      <h2>Комп'ютери</h2>
      <p id="message"></p>

      <form id="computer-form">
        <h3 id="form-title">Додати комп'ютер</h3>
        <input type="text" id="name" placeholder="Назва">
        <select id="type">
          <option value="ноутбук">ноутбук</option>
          <option value="ПК">ПК</option>
        </select>
        <input type="text" id="cpu" placeholder="Процесор">
        <input type="number" id="ram" placeholder="ОЗП, ГБ">
        <button type="submit" id="submit-button">Додати</button>
        <button type="button" id="cancel-button" hidden>Скасувати</button>
      </form>

      <div class="toolbar">
        <input type="text" id="search" placeholder="Пошук за назвою або процесором">
        <select id="filter-type">
          <option value="">Усі типи</option>
          <option value="ноутбук">ноутбук</option>
          <option value="ПК">ПК</option>
        </select>
        <select id="filter-status">
          <option value="">Усі статуси</option>
          <option value="available">Вільний</option>
          <option value="booked">Заброньований</option>
          <option value="rented">Виданий</option>
        </select>
        <select id="sort">
          <option value="name">Порядок: за назвою</option>
          <option value="ram-desc">ОЗП: від більшого</option>
          <option value="ram-asc">ОЗП: від меншого</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Назва</th>
            <th>Тип</th>
            <th>Процесор</th>
            <th>ОЗП, ГБ</th>
            <th>Статус</th>
            <th>Дії</th>
          </tr>
        </thead>
        <tbody id="computers-body"></tbody>
      </table>
    </section>

    <section id="bookings">
      <h2>Бронювання</h2>
      <p id="booking-message"></p>

      <form id="booking-form">
        <h3>Нове бронювання</h3>
        <select id="booking-computer"></select>
        <select id="booking-client"></select>
        <label>Початок <input type="date" id="booking-start"></label>
        <label>Завершення <input type="date" id="booking-end"></label>
        <button type="submit">Забронювати</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Комп'ютер</th>
            <th>Клієнт</th>
            <th>Початок</th>
            <th>Завершення</th>
            <th>Статус</th>
            <th>Дії</th>
          </tr>
        </thead>
        <tbody id="bookings-body"></tbody>
      </table>
    </section>
  </main>

  <footer>Курсовий проєкт · Попадюк Денис, ІС-23-01 · 2026</footer>

  <script src="app.js"></script>
</body>
</html>
