<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вебзастосунок обліку прокату комп'ютерів</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Прокат комп'ютерів</h1>
    <p>Вебзастосунок обліку комп'ютерів і бронювань</p>
  </header>

  <main>
  <section id="computers">
    <h2>Комп'ютери</h2>
    <p id="message"></p>
    <form id="computer-form">
  <h3>Додати комп'ютер</h3>
  <input type="text" id="name" placeholder="Назва">
  <select id="type">
    <option value="ноутбук">ноутбук</option>
    <option value="ПК">ПК</option>
  </select>
  <input type="text" id="cpu" placeholder="Процесор">
  <input type="number" id="ram" placeholder="ОЗП, ГБ">
  <button type="submit">Додати</button>
</form>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Назва</th><th>Тип</th>
          <th>Процесор</th><th>ОЗП, ГБ</th><th>Статус</th>
        </tr>
      </thead>
      <tbody id="computers-body"></tbody>
    </table>
  </section>
</main>

  <script src="js/app.js"></script>
</body>
</html>
